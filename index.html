<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לוח טהרה</title>
<!-- ===== הגדרה: כתובת ה-Worker שלך ב-Cloudflare (ריק = מצב מקומי בדפדפן בלבד) ===== -->
<script>window.TAHARAH_API = "https://tahara2.meny85502.workers.dev";</script>
<meta name="theme-color" content="#26305A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F7; --card:#FFFFFF; --ink:#18213A; --mute:#5E6782; --line:#DCE1EA;
  --night:#26305A; --night-t:#E3E6F2; --day:#F2C14E; --day-t:#FFF6DC;
  --blood:#A8323E; --blood-t:#F8E3E5; --water:#1F7A78; --water-t:#DDF0EE; --amber:#C47F12;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11152A; --card:#1A2038; --ink:#E8EAF3; --mute:#9AA2BD; --line:#2C3455;
  --night-t:#232B52; --day-t:#3A3420; --blood-t:#4A2229; --water-t:#173D3D; --day:#E7B544; --amber:#E0A23A; color-scheme:dark;
}}
:root[data-theme="dark"]{--paper:#11152A; --card:#1A2038; --ink:#E8EAF3; --mute:#9AA2BD; --line:#2C3455; --night-t:#232B52; --day-t:#3A3420; --blood-t:#4A2229; --water-t:#173D3D; --day:#E7B544; --amber:#E0A23A; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Assistant,system-ui,sans-serif}
#app{max-width:720px;margin:0 auto;padding:0 16px 110px}
h1,h2,h3{font-family:"Frank Ruhl Libre",serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,.cell:focus-visible{outline:3px solid var(--water);outline-offset:2px}
small{color:var(--mute)}

/* סטטוס היום – המשפט הראשון שרואים */
.status{margin:16px 0 18px;padding:18px 20px 20px;border-radius:var(--r);background:var(--night);color:#fff;position:relative;overflow:hidden}
.status::after{content:"";position:absolute;inset:auto -40px -60px auto;width:160px;height:160px;border-radius:50%;background:var(--day);opacity:.16}
.status.tone-water{background:var(--water)} .status.tone-blood{background:var(--blood)} .status.tone-amber{background:#5A3D0C}
.st-date{opacity:.8;font-size:.9rem}
.st-title{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:1.9rem;line-height:1.15;margin-top:4px}
.st-sub{opacity:.9;margin-top:6px;max-width:52ch}

nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px}
nav button{flex:1;padding:8px;border-radius:999px;font-weight:600;color:var(--mute)}
nav button.on{background:var(--ink);color:var(--paper)}

/* לוח החודש: כל משבצת = יום עברי, הלילה למעלה (היום העברי מתחיל בערב), היום למטה */
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 10px}
.cal-h h2{font-size:1.5rem}.cal-h h2 span{color:var(--mute);font-weight:500;font-size:1rem}
.ghost{padding:6px 12px;border-radius:10px;color:var(--mute);font-size:1.3rem}
.ghost:hover{background:var(--paper)}
.row-btns .ghost{font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.8rem;color:var(--mute);padding-bottom:2px}
.cell{position:relative;aspect-ratio:1/1.12;border-radius:10px;background:var(--paper);display:grid;grid-template-rows:28% 1fr 26%;overflow:hidden;padding:0;text-align:center}
.cell .half{display:flex;justify-content:center;align-items:center;gap:3px}
.cell .half.n{background:var(--night-t)}
.cell .hd{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:1.15rem;line-height:1;align-self:center}
.cell .gd{position:absolute;top:2px;left:5px;font-size:.62rem;color:var(--mute)}
.cell .cn{position:absolute;bottom:2px;right:5px;font-size:.62rem;font-weight:700;color:var(--water)}
.cell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.seeing{background:var(--blood-t)}
.cell.seeing.seen-day .half.n{background:var(--night-t)}
.cell.seeing:not(.seen-day) .half.n{background:var(--blood)}
.cell.clean{background:var(--water-t)}
.cell.hefsek{background:linear-gradient(var(--blood-t) 0 72%, var(--water-t) 72%)}
.mk{display:inline-block;width:9px;height:9px;border-radius:50%}
.mk-perisha{background:var(--amber)} .mk-oz{box-shadow:inset 0 0 0 2px var(--amber)} .mk-tevila{background:var(--water);border-radius:2px;transform:rotate(45deg)}
.mk.faint{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--mute);margin:12px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}

.up{margin-top:22px}.up h3,.box h3{font-size:1.2rem;margin-bottom:8px}
.up ul,.day-list{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:7.5rem 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ev-when b{display:block;font-family:"Frank Ruhl Libre",serif}
.ev-when small{font-size:.8rem}
.ev-body{display:flex;flex-direction:column}
.ev-t{font-weight:600}.ev-time{color:var(--ink);font-weight:600}
.ev-perisha .ev-t,.ev-oz .ev-t{color:var(--amber)} .ev-tevila .ev-t,.ev-hefsek .ev-t{color:var(--water)}
.ev.faint{opacity:.55}
.empty{color:var(--mute);padding:20px 0}

.log .row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;cursor:pointer}
.row header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.row header b{width:1.8rem;height:1.8rem;border-radius:50%;background:var(--night);color:#fff;display:inline-grid;place-items:center;font-size:.85rem}
.row .rd{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:1.2rem}
.row dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:10px 0 0;font-size:.95rem}
.row dt{color:var(--mute)} .row dd{margin:0}.row dd.kv{color:var(--blood);font-weight:700}
.note{background:var(--day-t);border-radius:8px;padding:6px 10px;font-size:.9rem;margin:10px 0 0}
.hint{color:var(--mute);font-size:.9rem}.hint.small{font-size:.8rem;margin-top:18px}

.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
label{display:block;margin:10px 0;font-weight:600;font-size:.95rem}
input:not([type=checkbox]):not([type=radio]),select{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}
.sw{display:flex;gap:10px;align-items:center;font-weight:400}
.sw input{width:20px;height:20px;accent-color:var(--water)}
.copy{display:flex;gap:6px}.copy input{direction:ltr;font-size:.8rem}
.row-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.row-btns button,.filebtn,.copy button{padding:10px 16px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-weight:600;margin:0}
.primary{background:var(--night)!important;color:#fff!important;border-color:var(--night)!important}
.danger{color:var(--blood)!important;margin-inline-end:auto!important}

#add{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:14px 26px;border-radius:999px;background:var(--blood);color:#fff;font-weight:700;font-size:1.05rem;box-shadow:0 8px 24px rgba(24,33,58,.25)}

dialog{border:0;padding:0;border-radius:18px;background:var(--card);color:var(--ink);width:min(520px,calc(100% - 24px));max-height:88vh}
dialog::backdrop{background:rgba(17,21,42,.55)}
.sheet{padding:20px}.sheet h3{font-size:1.4rem}.sheet h3 small{font-family:Assistant;font-size:.9rem}
.heb-preview{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:1.15rem;color:var(--night);margin:4px 0 0}
@media (prefers-color-scheme: dark){.heb-preview{color:var(--day)}}
.onah{border:0;padding:0;margin:12px 0;display:grid;gap:6px}
.onah legend{font-weight:600;margin-bottom:4px}
.onah label{margin:0;font-weight:400}
.onah input{position:absolute;opacity:0}
.onah span{display:block;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-weight:600}
.onah span small{display:block;font-weight:400}
.onah input:checked+span{border-color:var(--night);background:var(--night-t)}
.onah input:focus-visible+span{outline:3px solid var(--water)}

#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-weight:600;z-index:10}
body.auth #add, body.auth nav, body.auth #status{display:none}
.auth-f{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.auth-f h1{font-size:2rem}.auth-f .primary{width:100%;padding:12px;border-radius:10px;margin-top:8px}.auth-f .ghost{width:100%;font-size:1rem;margin-top:6px}
.demo{background:var(--day-t);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:.9rem}.demo button{text-decoration:underline;font-weight:700}
.err{color:var(--blood);font-weight:600}
@media (max-width:420px){.ev{grid-template-columns:6rem 1fr}.st-title{font-size:1.6rem}.cell .hd{font-size:1rem}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="status" class="status"></div>
  <p id="demo" class="demo" hidden>מוצגים נתוני דוגמה. <button id="demo-clear">ניקוי הדוגמה והתחלת רישום</button></p>
  <nav><button data-tab="cal" class="on">לוח</button><button data-tab="log">רישומים</button><button data-tab="set">הגדרות</button></nav>
  <main id="main"></main>
</div>
<button id="add">רישום ראייה</button>
<dialog id="dlg"></dialog>
<div id="toast" hidden></div>
